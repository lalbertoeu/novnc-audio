<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>noVNC Audio Demo Clip</title>
<style>
  html,body { margin:0; height:100%; background:#111; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  video { width:100%; height:100%; object-fit:contain; display:block; }
  #btn {
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    font:bold 48px/1.6 sans-serif; color:#fff; background:#16a34a;
    border:none; border-radius:16px; padding:24px 96px; cursor:pointer;
    z-index:10; box-shadow:0 6px 24px rgba(0,0,0,.5);
  }
</style>
</head>
<body>
<div id="stage"><video id="v" src="demo-clip.mp4" loop playsinline></video></div>
<button id="btn">▶ PLAY</button>
<script>
  const v = document.getElementById('v');
  const b = document.getElementById('btn');
  function start() {
    b.remove();
    v.muted = false;
    v.play().then(() => v.volume = 1.0).catch(e => console.error(e));
  }
  b.addEventListener('click', start);
  v.addEventListener('click', start);
</script>
</body>
</html>
